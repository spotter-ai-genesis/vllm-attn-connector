[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-attn-connector"
version = "0.1.0"
description = "Out-of-tree vLLM connector capturing exact per-decode-step attention over the prompt, as Flowcept provenance."
requires-python = ">=3.10"
license = "MIT"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = []  # vllm and flowcept provided by the host environment

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# e2e_smoke.py needs a GPU and a real engine, and is driven by CLI flags rather
# than collected: keep plain `pytest` to the checks that run anywhere.
testpaths = ["tests"]
python_files = ["test_*.py"]
